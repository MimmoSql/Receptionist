<!-- Popup per il grafico -->
<div *ngIf="showChartPopup" class="chart-popup">
  <div class="popup-content">
    <span class="close" (click)="closeChartPopup()">&times;</span>
    
    <!-- Visualizzazione mensile -->
    <div *ngIf="viewMode === 'monthly'">
      <div>
        <button (click)="backToMonthly()">Torna ai dati mensili</button>
      </div>
      <div>
        <canvas baseChart
          [datasets]="barChartData"
          [labels]="barChartLabels"
          [options]="barChartOptions"
          [legend]="barChartLegend"
          [type]="barChartType">
        </canvas>
      </div>
    </div>

    <!-- Visualizzazione giornaliera -->
    <div *ngIf="viewMode === 'daily'">
      <div>
        <button (click)="backToMonthly()">Torna ai dati mensili</button>
      </div>
      <div>
        <canvas baseChart
          [datasets]="barChartData"
          [labels]="barChartLabels"
          [options]="barChartOptions"
          [legend]="barChartLegend"
          [type]="barChartType">
        </canvas>
      </div>
    </div>
  </div>
</div>
